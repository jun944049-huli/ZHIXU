<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知序 · 图标方案</title>
  <style>
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f8f9fb;color:#25282e;font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:0 auto;padding:52px 32px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}h1{font-size:28px;font-weight:600;margin:0}header p{color:#858b95;margin:6px 0 0}.edition{color:#858b95;font-size:12px}.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.option{min-width:0}.icon-stage{height:220px;display:grid;place-items:center;background:#fff;border:1px solid #e7e9ed;border-radius:8px}.icon-stage img{width:116px;height:116px}.option h2{font-size:16px;margin:20px 0 6px;font-weight:600}.option p{font-size:12px;color:#737a85;margin:0}.sizes{display:flex;align-items:center;gap:12px;margin-top:22px;height:36px}.sizes span{font-size:12px;margin-left:auto;color:#949aa3}footer{margin-top:45px;padding-top:25px;border-top:1px solid #e7e9ed;color:#858b95;font-size:12px}a{color:#2670d9;text-decoration:none}nav{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}@media(max-width:800px){.options{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:flex-start}.edition{display:none}}@media(max-width:450px){main{padding:30px 20px}.options{gap:24px 14px}.icon-stage{height:160px}.icon-stage img{width:90px;height:90px}.sizes{gap:8px}.sizes span{display:none}.option h2{font-size:14px}}
  </style>
</head>
<body>
<main>
  <header><div><h1>知序</h1><p>图标方案</p></div><span class="edition">已选定 C · 白色背景</span></header>
  <section class="options" aria-label="四款图标方案">
    <article class="option"><div class="icon-stage"><img src="../prototype/brand/zhixu-a.svg" alt="A 归序"></div><h2>A · 归序</h2><p>Z 字骨架与归整横线，强调从信息到行动。<br>石墨黑，辅以一处薄荷绿。</p><div class="sizes"><img src="../prototype/brand/zhixu-a.svg" width="32" height="32" alt=""><img src="../prototype/brand/zhixu-a.svg" width="20" height="20" alt=""><img src="../prototype/brand/zhixu-a.svg" width="16" height="16" alt=""><span>小尺寸</span></div></article>
    <article class="option"><div class="icon-stage"><img src="../prototype/brand/zhixu-b.svg" alt="B 知页"></div><h2>B · 知页</h2><p>将文档折页与递进短线组合，强调资料整理。<br>清晰的蓝白对比。</p><div class="sizes"><img src="../prototype/brand/zhixu-b.svg" width="32" height="32" alt=""><img src="../prototype/brand/zhixu-b.svg" width="20" height="20" alt=""><img src="../prototype/brand/zhixu-b.svg" width="16" height="16" alt=""><span>小尺寸</span></div></article>
    <article class="option"><div class="icon-stage"><img src="../prototype/brand/zhixu-c.svg" alt="C 序环"></div><h2>C · 序环 · 已选定</h2><p>开放的环与条目，表达持续推进的工作闭环。<br>白色底，绿色进展节点。</p><div class="sizes"><img src="../prototype/brand/zhixu-c.svg" width="32" height="32" alt=""><img src="../prototype/brand/zhixu-c.svg" width="20" height="20" alt=""><img src="../prototype/brand/zhixu-c.svg" width="16" height="16" alt=""><span>小尺寸</span></div></article>
    <article class="option"><div class="icon-stage"><img src="../prototype/brand/zhixu-d.svg" alt="D 知行"></div><h2>D · 知行</h2><p>字母 Z 连向前进箭头，强调计划转为执行。<br>松绿底，柔白线条。</p><div class="sizes"><img src="../prototype/brand/zhixu-d.svg" width="32" height="32" alt=""><img src="../prototype/brand/zhixu-d.svg" width="20" height="20" alt=""><img src="../prototype/brand/zhixu-d.svg" width="16" height="16" alt=""><span>小尺寸</span></div></article>
  </section>
  <footer>已选定白底 C 方案，统一应用、窗口与桌面图标。知序 0.2.0。

  </footer>
</main>
</body>
</html>
